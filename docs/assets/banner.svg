<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">QweProtectStones</title>
  <desc id="desc">Приваты с характером. Защита территорий, осады и управление. Светящийся кристалл-ядро на тёмном фоне.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="0.55" stop-color="#161233"/>
      <stop offset="1" stop-color="#241a45"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d0ff"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9ff"/>
      <stop offset="1" stop-color="#a48bfa"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9067f0"/>
      <stop offset="1" stop-color="#3c2c72"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe3f5"/>
      <stop offset="1" stop-color="#4a3f96"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#c4b5fd" fill-opacity="0.14"/>
    </pattern>
    <mask id="dotsMask">
      <linearGradient id="dotsFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000"/>
        <stop offset="0.45" stop-color="#000"/>
        <stop offset="0.75" stop-color="#fff"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <rect width="1200" height="340" fill="url(#dotsFade)"/>
    </mask>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowSmall" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#dots)" mask="url(#dotsMask)"/>
  <circle cx="955" cy="172" r="230" fill="url(#halo)"/>
  <circle cx="1030" cy="120" r="140" fill="url(#haloCyan)"/>

  <g>
    <rect x="56" y="60" width="30" height="6" rx="3" fill="url(#accentLine)"/>
    <rect x="92" y="60" width="10" height="6" rx="3" fill="url(#accentLine)" opacity="0.5"/>

    <text x="56" y="128" fill="url(#titleFade)" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">QweProtectStones</text>

    <text x="57" y="172" fill="#c9bdfb" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500">Приваты с характером</text>
    <text x="57" y="205" fill="#9891b8" font-family="'Segoe UI', Arial, sans-serif" font-size="18">Защита территорий, осады и управление командой</text>

    <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#e3ddfb">
      <rect x="57" y="246" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.25"/>
      <circle cx="76" cy="263" r="4" fill="#a78bfa"/>
      <text x="88" y="268">Paper 1.21.4</text>

      <rect x="197" y="246" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.25"/>
      <circle cx="216" cy="263" r="4" fill="#67e8f9"/>
      <text x="228" y="268">Java 21</text>

      <rect x="305" y="246" width="76" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#c4b5fd" stroke-opacity="0.25"/>
      <circle cx="324" cy="263" r="4" fill="#a78bfa"/>
      <text x="336" y="268">QPS</text>
    </g>
  </g>

  <g>
    <ellipse cx="965" cy="290" rx="130" ry="18" fill="#000000" opacity="0.25" filter="url(#softBlur)"/>

    <!-- защитное силовое поле вокруг камня-претензии -->
    <g fill="none" stroke-linecap="round">
      <ellipse cx="965" cy="174" rx="158" ry="58" stroke="url(#accentLine)" stroke-opacity="0.35" stroke-width="1.6"/>
      <ellipse cx="965" cy="174" rx="158" ry="58" stroke="#a78bfa" stroke-opacity="0.26" stroke-width="1.4" transform="rotate(60 965 174)"/>
      <ellipse cx="965" cy="174" rx="158" ry="58" stroke="#67e8f9" stroke-opacity="0.26" stroke-width="1.4" transform="rotate(120 965 174)">
        <animateTransform attributeName="transform" type="rotate" from="120 965 174" to="480 965 174" dur="26s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <circle cx="965" cy="116" r="3" fill="#c4b5fd"/>
    <circle cx="965" cy="116" r="7" fill="#c4b5fd" opacity="0.4" filter="url(#glowSmall)"/>
    <circle cx="1108" cy="174" r="2.6" fill="#67e8f9"/>
    <circle cx="1108" cy="174" r="6" fill="#67e8f9" opacity="0.35" filter="url(#glowSmall)"/>
    <circle cx="822" cy="174" r="2.6" fill="#a78bfa"/>
    <circle cx="822" cy="174" r="6" fill="#a78bfa" opacity="0.35" filter="url(#glowSmall)"/>

    <!-- парящий камень-претензия -->
    <path d="M895 138 965 100 1035 138 965 176Z" fill="url(#faceTop)"/>
    <path d="M895 138 965 176 965 248 895 210Z" fill="url(#faceLeft)"/>
    <path d="M965 176 1035 138 1035 210 965 248Z" fill="url(#faceRight)"/>
    <path d="M895 138 965 176 1035 138M965 176V248" fill="none" stroke="#f3ecff" stroke-opacity="0.55" stroke-width="1.8"/>

    <!-- гравировка-руна вместо галочки -->
    <path d="M965 114 983 128 965 143 947 128Z" fill="none" stroke="#ecfeff" stroke-width="2.4" stroke-linejoin="round" stroke-opacity="0.9"/>
    <circle cx="965" cy="128" r="3.2" fill="#ecfeff"/>

    <!-- осколки, удерживаемые полем -->
    <path d="M1076 209 1089 202 1102 209 1089 217Z" fill="url(#faceRight)" opacity="0.9"/>
    <path d="M846 149 857 143 868 149 857 156Z" fill="url(#faceLeft)" opacity="0.9"/>

    <path d="M1093 59v13m-6.5-6.5h13" stroke="#c4b5fd" stroke-width="2" opacity="0.55"/>
  </g>

  <rect width="1200" height="340" rx="28" fill="url(#vignette)"/>
</svg>
