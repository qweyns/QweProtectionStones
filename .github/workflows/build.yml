name: Build

# Сборка и тесты при каждом пуше и в каждом pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        shell: bash
        run: mvn -B -ntp clean package 2>&1 | tee "$RUNNER_TEMP/qps-build.log"

      - name: Report build failure
        if: failure()
        # Аннотация доступна через Checks API даже если скачивание логов CI недоступно.
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/qps-build.log" ]; then
            text=$(tail -80 "$RUNNER_TEMP/qps-build.log")
            text="${text//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error title=Build diagnostics::$text"
          fi

      - name: Summarize tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob('target/surefire-reports/TEST-*.xml')
          if files:
              totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
              for file in files:
                  root = ET.parse(file).getroot()
                  for case in root.findall('testcase'):
                      for failure in list(case.findall('failure')) + list(case.findall('error')):
                          detail = (failure.get('message') or failure.text or '')[:3000]
                          detail = detail.encode('unicode_escape').decode().replace('%', '%25')
                          print(f"::error title=JUnit failure::{case.get('classname')}#{case.get('name')}: {detail}")
                  for key in totals:
                      totals[key] += int(root.get(key, '0'))
              message = ', '.join(f'{key}={value}' for key, value in totals.items())
              print(f'::notice title=JUnit::{message}; suites={len(files)}')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## JUnit\n' + message + f'; suites={len(files)}\n')
          PYTEST

      - name: Check shaded jar contents
        # классы зависимостей должны попасть в jar после релокации:
        # NoClassDefFoundError при загрузке плагина ловится только так
        run: |
          JAR=$(ls target/QweProtectStones-*.jar)
          for cls in \
            org/qweyns/qweprotectstones/libs/bstats/charts/CustomChart.class \
            org/qweyns/qweprotectstones/libs/bstats/bukkit/Metrics.class \
            org/qweyns/qweprotectstones/libs/hikari/HikariDataSource.class; do
            if ! unzip -l "$JAR" | grep -q "$cls"; then
              echo "В jar нет $cls — shading сломан"; exit 1
            fi
          done
          echo "Shading проверен: bstats и HikariCP на месте"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QweProtectStones-jar
          path: target/QweProtectStones-*.jar
          if-no-files-found: error
