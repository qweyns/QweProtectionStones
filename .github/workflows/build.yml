name: Build

# Сборка и тесты при каждом пуше и в каждом pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QweProtectStones-jar
          path: target/QweProtectStones-*.jar
          if-no-files-found: error
