    material: BLACK_STAINED_GLASS_PANE
    display_name: "&8Сборка интерфейса..."
  anim_bg:
    material: BLACK_STAINED_GLASS_PANE
    display_name: " "
  anim_bg2:
    material: GRAY_STAINED_GLASS_PANE
    display_name: " "
  anim_chain:
    material: CHAIN
    display_name: " "

# ==========================================
# ДВИЖОК АНИМАЦИИ (КУЗНИЦА - СБОРКА РАМКИ 45 СЛОТОВ)
# БЕЗ МИГАНИЙ И ЗАЦИКЛИВАНИЙ
# ==========================================
animations:
  default:
    # 1. Заливаем всё меню черным экраном
    - tick: 0
      opcodes:
        - fill: anim_cover

    # 2. Начинаем симметричную "отрисовку" рамки с верхнего центра (слот 4)
    - tick: 2
      opcodes:
        - set: anim_bg2 4
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 4
      opcodes:
        - set: anim_bg 3,5
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 6
      opcodes:
        - set: anim_bg2 2,6
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 8
      opcodes:
        - set: anim_bg 1,7
        - sound: UI_BUTTON_CLICK 1.0 1.5

    # 3. Углы закрепляем цепями (звук наковальни)
    - tick: 10
      opcodes:
        - set: anim_chain 0,8
        - sound: BLOCK_ANVIL_PLACE 0.5 2.0

    # 4. Спускаемся вниз по бокам (1-й ряд сверху)
    - tick: 12
      opcodes:
        - set: anim_bg2 9,17
        - sound: UI_BUTTON_CLICK 1.0 1.5

    # 5. Спускаемся по бокам (Центральный ряд)
    - tick: 14
      opcodes:
        - set: anim_bg 18,26
        - sound: UI_BUTTON_CLICK 1.0 1.5

    # 6. Спускаемся по бокам (3-й ряд сверху)
    - tick: 16
      opcodes:
        - set: anim_bg2 27,35
        - sound: UI_BUTTON_CLICK 1.0 1.5

    # 7. Нижние углы закрепляем цепями
    - tick: 18
      opcodes:
        - set: anim_chain 36,44
        - sound: BLOCK_ANVIL_PLACE 0.5 2.0

    # 8. Идем к центру по нижней грани
    - tick: 20
      opcodes:
        - set: anim_bg 37,43
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 22
      opcodes:
        - set: anim_bg2 38,42
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 24
      opcodes:
        - set: anim_bg 39,41
        - sound: UI_BUTTON_CLICK 1.0 1.5

    # 9. Рамка замкнулась! Открываем кнопку Назад (Слот 40)
    - tick: 26
      opcodes:
        - remove: 40
        - sound: BLOCK_NOTE_BLOCK_CHIME 1.0 1.0

    # 10. Очищаем пустоты вокруг кнопок эффектов
    - tick: 30
      opcodes:
        - remove: 10,12,14,16,20,22,24,28,30,31,32,34
        - sound: BLOCK_IRON_TRAPDOOR_OPEN 1.0 0.8

    # 11. Каскадное появление всех 9 эффектов (Сверху вниз, слева направо)
    - tick: 34
      opcodes:
        - remove: 11
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.0
    - tick: 36
      opcodes:
        - remove: 13
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.1
    - tick: 38
      opcodes:
        - remove: 15
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.2
    - tick: 40
      opcodes:
        - remove: 19
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.3
    - tick: 42
      opcodes:
        - remove: 21
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.4
    - tick: 44
      opcodes:
        - remove: 23
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.5
    - tick: 46
      opcodes:
        - remove: 25
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.6
    - tick: 48
      opcodes:
        - remove: 29
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.7
    - tick: 50
      opcodes:
        - remove: 33
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.8