# ============
# ГЛАВНОЕ МЕНЮ
# ============
# ------------------------------------------------------------------
#  СПРАВКА ПО ФОРМАТУ МЕНЮ (одинакова для всех файлов в /menus/)
#
#  Поля предмета:
#    slot: N                  — слот (0 … size-1); slots: [N, N, N] — сразу несколько
#    priority: N              — порядок отрисовки при конфликте за слот (меньше — раньше)
#    material: X              — предмет; %region_material% = блок-ядро привата
#    display_name / lore      — текст (MiniMessage: <bold>, <#RRGGBB>, <gradient:...>)
#    amount: N                — количество в стаке
#    enchantments:            — зачарования, например ["unbreaking:1"]
#    view_requirement         — условия, при которых предмет ВИДЕН
#    click_requirement        — условия клика (не прошёл — выполнятся deny_commands)
#
#  Действия в click_commands (по порядку; если оплата не прошла —
#  цепочка обрывается):
#    [close]                        закрыть меню
#    [refresh]                      перерисовать меню
#    [openguimenu] <имя>            открыть другое меню из /menus/
#    [message] <текст>              сообщение игроку
#    [player] <команда>             команда от имени игрока
#    [console] <команда>            команда от имени консоли
#    [sound] ЗВУК[:громкость[:высота]]
#    [connect] <сервер>             перевести на сервер (BungeeCord)
#    [takemoney] <сумма>            снять деньги (нужен Vault)
#    [takeexp] <уровни>             снять уровни опыта
#    [takepoints] <число>           снять очки (нужен PlayerPoints)
#    [region_add_effect] <ИМЯ> <уровень>
#    Строка без [префикса] игнорируется — пишите [player] явно.
#
#  Типы требований (…requirement.requirements.<ключ>.type):
#    has money / has points / has exp     (amount: N)
#    has permission                       (permission: право)
#    region_durability_enabled / region_durability_disabled
#    is_owner / under_siege / trust_level (level: manager)
#    has effect / does not have effect    (effect_name: SPEED)
#    allowed_effect / not_allowed_effect  (effect_name: SPEED)
#
#  Плейсхолдеры: %player% %region_id% %owner% %name% %members%
#    %durability% %max_durability% %penalty% %siege% %effect_level_<ИМЯ>%
#    и любые из PlaceholderAPI, если он установлен.
# ------------------------------------------------------------------
menu_title: "<bold><gradient:#A78BFA:#C4B5FD:#F9A8D4>Управление регионом</gradient></bold>"
size: 27
items:
  upgrade_btn:
    slot: 11
    material: ANCIENT_DEBRIS
    display_name: "<bold><gradient:#E9D5FF:#DDD6FE:#FBCFE8>Улучшить прочность</gradient></bold>"
    lore:
      - "<#F2EFFA>▪ Нажмите, чтобы перейти к"
      - "<#F2EFFA>  укреплению защиты привата."
      - ""
      - "<#FB7185>⚠ Штраф от недавних атак: <#FDE68A>%penalty%"
    click_commands:
      - "[openguimenu] upgrade"
      - "[sound] UI_BUTTON_CLICK"

  effects_btn:
    slot: 15
    material: BEACON
    display_name: "<bold><gradient:#8B5CF6:#A78BFA:#F472B6>Магазин эффектов</gradient></bold>"
    lore:
      - "<#F2EFFA>▪ Покупка постоянных баффов,"
      - "<#F2EFFA>  уведомлений и бустеров."
    click_commands:
      - "[openguimenu] effects"
      - "[sound] UI_BUTTON_CLICK"

  close_btn:
    slot: 22
    material: BARRIER
    display_name: "<bold><#FB7185>Закрыть</bold>"
    click_commands:
      - "[close]"
      - "[sound] UI_BUTTON_CLICK"

  # ==========================================
  # ПРЕДМЕТЫ ДЛЯ АНИМАЦИИ
  # ==========================================
  anim_cover:
    material: BLACK_STAINED_GLASS_PANE
    display_name: "<#A79FC0>Запуск систем защиты..."
  anim_bg:
    material: BLACK_STAINED_GLASS_PANE
    display_name: "<white> "
  anim_bg2:
    material: GRAY_STAINED_GLASS_PANE
    display_name: "<white> "
  anim_chain:
    material: CHAIN
    display_name: "<white> "

# ==========================================
# ДВИЖОК АНИМАЦИИ (Без миганий)
# ==========================================
animations:
  default:
    - tick: 0
      opcodes:
        - fill: anim_cover
    - tick: 2
      opcodes:
        - set: anim_bg2 4
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 4
      opcodes:
        - set: anim_bg 3,5
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 6
      opcodes:
        - set: anim_bg2 2,6
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 8
      opcodes:
        - set: anim_bg 1,7
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 10
      opcodes:
        - set: anim_chain 0,8
        - sound: BLOCK_ANVIL_PLACE 0.5 2.0
    - tick: 12
      opcodes:
        - set: anim_bg2 9,17
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 14
      opcodes:
        - set: anim_chain 18,26
        - sound: BLOCK_ANVIL_PLACE 0.5 2.0
    - tick: 16
      opcodes:
        - set: anim_bg 19,25
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 18
      opcodes:
        - set: anim_bg2 20,24
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 20
      opcodes:
        - set: anim_bg 21,23
        - sound: UI_BUTTON_CLICK 1.0 1.5

    # Рамка замкнулась! Убираем заглушку в слоте 22 (показывается кнопка Назад)
    - tick: 22
      opcodes:
        - remove: 22
        - sound: BLOCK_NOTE_BLOCK_CHIME 1.0 1.0

    # Очищаем пустоты вокруг кнопок
    - tick: 26
      opcodes:
        - remove: 10,12,13,14,16
        - sound: BLOCK_IRON_TRAPDOOR_OPEN 1.0 0.8

    # Мощно появляется кнопка "Улучшить" (Слот 11)
    - tick: 29
      opcodes:
        - remove: 11
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.2

    # Мощно появляется кнопка "Эффекты" (Слот 15)
    - tick: 35
      opcodes:
        - remove: 15
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.4
