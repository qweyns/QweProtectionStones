# ============
# ГЛАВНОЕ МЕНЮ
# ============
menu_title: "<bold><gradient:#c21500:#ffc500>Управление регионом</gradient></bold>"
size: 27
items:
  upgrade_btn:
    slot: 11
    material: ANCIENT_DEBRIS
    display_name: "<bold><gradient:#E67E22:#F39C12>Улучшить прочность</gradient></bold>"
    lore:
      - "<#BDC3C7>▪ Нажмите, чтобы перейти к"
      - "<#BDC3C7>  укреплению защиты привата."
      - ""
      - "<#E74C3C>⚠ Штраф от недавних атак: <#F1C40F>%penalty%"
    click_commands:
      - "[openguimenu] upgrade"
      - "[sound] UI_BUTTON_CLICK"

  effects_btn:
    slot: 15
    material: BEACON
    display_name: "<bold><gradient:#00B4DB:#0083B0>Магазин эффектов</gradient></bold>"
    lore:
      - "<#BDC3C7>▪ Покупка постоянных баффов,"
      - "<#BDC3C7>  уведомлений и бустеров."
    click_commands:
      - "[openguimenu] effects"
      - "[sound] UI_BUTTON_CLICK"

  close_btn:
    slot: 22
    material: BARRIER
    display_name: "<bold><#E74C3C>Закрыть</bold>"
    click_commands:
      - "[close]"
      - "[sound] UI_BUTTON_CLICK"

  # ==========================================
  # ПРЕДМЕТЫ ДЛЯ АНИМАЦИИ
  # ==========================================
  anim_cover:
    material: BLACK_STAINED_GLASS_PANE
    display_name: "<#7F8C8D>Запуск систем защиты..."
  anim_bg:
    material: BLACK_STAINED_GLASS_PANE
    display_name: "<white> "
  anim_bg2:
    material: GRAY_STAINED_GLASS_PANE
    display_name: "<white> "
  anim_chain:
    material: CHAIN
    display_name: "<white> "

# ==========================================
# ДВИЖОК АНИМАЦИИ (Без миганий)
# ==========================================
animations:
  default:
    - tick: 0
      opcodes:
        - fill: anim_cover
    - tick: 2
      opcodes:
        - set: anim_bg2 4
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 4
      opcodes:
        - set: anim_bg 3,5
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 6
      opcodes:
        - set: anim_bg2 2,6
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 8
      opcodes:
        - set: anim_bg 1,7
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 10
      opcodes:
        - set: anim_chain 0,8
        - sound: BLOCK_ANVIL_PLACE 0.5 2.0
    - tick: 12
      opcodes:
        - set: anim_bg2 9,17
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 14
      opcodes:
        - set: anim_chain 18,26
        - sound: BLOCK_ANVIL_PLACE 0.5 2.0
    - tick: 16
      opcodes:
        - set: anim_bg 19,25
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 18
      opcodes:
        - set: anim_bg2 20,24
        - sound: UI_BUTTON_CLICK 1.0 1.5
    - tick: 20
      opcodes:
        - set: anim_bg 21,23
        - sound: UI_BUTTON_CLICK 1.0 1.5

    # Рамка замкнулась! Убираем заглушку в слоте 22 (показывается кнопка Назад)
    - tick: 22
      opcodes:
        - remove: 22
        - sound: BLOCK_NOTE_BLOCK_CHIME 1.0 1.0

    # Очищаем пустоты вокруг кнопок
    - tick: 26
      opcodes:
        - remove: 10,12,13,14,16
        - sound: BLOCK_IRON_TRAPDOOR_OPEN 1.0 0.8

    # Мощно появляется кнопка "Улучшить" (Слот 11)
    - tick: 29
      opcodes:
        - remove: 11
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.2

    # Мощно появляется кнопка "Эффекты" (Слот 15)
    - tick: 35
      opcodes:
        - remove: 15
        - sound: BLOCK_NOTE_BLOCK_HAT 1.0 1.4
