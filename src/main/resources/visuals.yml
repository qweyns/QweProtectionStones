# ============================================================
#   QweProtectStones — как приваты выглядят и звучат (visuals.yml)
# ============================================================

# --- ВИЗУАЛЬНЫЕ НАСТРОЙКИ ------------------------------------------------------
visuals:
  # Частицы, которыми рисуются границы.
  # density: 0.5 — вдвое плотнее, 2.0 — вдвое реже и дешевле.
  # Цвет учитывается только у DUST. max_points — потолок точек на каркас.
  particle:
    type: DUST
    size: 1.5
    density: 1.0
    max_points: 2000
  # Цвета кратковременной подсветки границ:
  boundaries:
    color_open: "#C4B5FD"    # создание привата
    color_closed: "#FB7185"  # удаление привата
    color_info: "#F9A8D4"    # показ границ по /ps info
    vertical_radius: 8             # высота каркаса вокруг ядра, 1..256 блоков
    glow_color_first: "#00FF00"     # два цвета /ps glow
    glow_color_second: "#008000"
    show_time_ticks: 40      # сколько тиков показывается подсветка

  # Всплывающий урон. Выключатель — siege.damage_indicator в siege.yml.
  damage_indicator:
    offset_y: 1.2       # начальная высота, 0..16
    rise: 1.2           # подъём, 0..16
    spread: 0.2         # случайный разброс X/Z, 0..1; 0 — без разброса
    animation_ticks: 30 # 0..59 (ограничение TextDisplay)
    lifetime_ticks: 35  # 1..1200

# --- КАРТА (Dynmap) --------------------------------------------------------------
map:
  dynmap:
    # Рисовать границы приватов на Dynmap, если он установлен.
    enable: true
    layer_name: "Приваты"
    line_color: "#A78BFA"
    fill_color: "#C4B5FD"
    fill_opacity: 0.25
  bluemap:
    # Рисовать границы приватов на BlueMap, если он установлен (API 2.x).
    enable: true
    marker_set_label: "Приваты"
    line_color: "#A78BFA"
    fill_color: "#C4B5FD"
    fill_opacity: 0.25
    line_width: 2
    # Слой можно скрыть по умолчанию и включать кнопкой в интерфейсе карты.
    default_hidden: false
    toggleable: true
