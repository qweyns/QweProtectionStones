# ============================================================
#   QweProtectStones v2.0.0 — приваты на блоках-ядрах
# ============================================================
#  Как работает плагин:
#   • игрок ставит блок-ядро (типы блоков — в regions.yml);
#   • вокруг ядра возникает защищённая территория;
#   • ядро можно «осаждать» взрывами — у него есть прочность;
#   • управление: меню по клику на ядро или /ps <команда>.
#
#  Этот файл — общие настройки. Типы приватов (блоки, размеры,
#  прочность, голограммы) живут в regions.yml.
#
#  После правок: /qps reload — применит почти всё.
#  Смена имени команды (settings.command) — только после рестарта.
# ============================================================

# --- БАЗА ДАННЫХ -----------------------------------------------------------
database:
  # SQLITE — локальная база-файл (ничего настраивать не нужно),
  # MYSQL — отдельный сервер (заполните поля ниже).
  type: "SQLITE"
  # Префикс таблиц плагина в базе. Менять стоит только при конфликте имён.
  table_prefix: "qps_"
  # Дальнейшие поля используются только при type: "MYSQL".
  host: "localhost"
  port: 3306
  database: "qweprotectstones"
  username: "root"
  password: ""
  use_ssl: false
  # Пул соединений. Для SQLITE всегда принудительно 1 — так устроен движок.
  pool_size: 10

# --- ОСНОВНЫЕ НАСТРОЙКИ ----------------------------------------------------
settings:
  # Язык сообщений: ru_RU, en_US, es_ES, zh_CN (файлы в /lang/).
  language: "ru_RU"

  # Главная команда игроков. Регистрируется при запуске.
  # Если имя занято другим плагином, команда останется доступна
  # как /qweprotectstones:<имя>.
  command:
    name: "ps"
    aliases:
      - "приват"
      - "region"
      - "land"
      - "rg"

  # Зажав SHIFT, игрок ставит блок-ядро как обычный блок — приват
  # не создаётся. Удобно, когда ядро хочется использовать в постройке.
  sneak_places_plain_block: true

  # Пауза (в секундах) между созданием приватов одним игроком.
  # Защищает от спама стаком блоков-ядер. Администраторов не касается.
  # 0 — без ограничения.
  region_cooldown_seconds: 3

  # Показывать зелёный контур будущего привата, когда блок-ядро в руке.
  preview_borders: true

  # Сколько секунд действует приглашение /ps invite <ник>.
  invite_expire_seconds: 120

  # Радиус (в блоках), в котором соседям слышно, что рядом идёт рейд
  # (звук raid_nearby + уведомление). 0 — не сообщать соседям.
  raid_neighbour_radius: 48

  # --- ЗАБРОШЕННЫЕ ПРИВАТЫ -------------------------------------------------
  # Автоудаление приватов игроков, которые давно не заходили на сервер.
  abandoned:
    enable: false
    # Сколько дней не заходил владелец, чтобы приват считался брошенным.
    inactive_days: 60
    # Как часто проверять (в минутах).
    check_interval_minutes: 60
    # Не трогать приваты, в которые вложились (прочность выше стартовой).
    keep_upgraded: true

  # --- ЖУРНАЛ ДЕЙСТВИЙ -----------------------------------------------------
  # Кто из доверенных что ломал, ставил и открывал. Просмотр: /ps log
  action_log:
    enable: true
    # Записывать ли открытие сундуков и прочих контейнеров.
    log_containers: true
    # Сколько дней хранить записи (старые удаляются при запуске).
    keep_days: 14

  # Предмет, которым оплачивается прокачка прочности в меню «Улучшение».
  # Тип привата может задать свой — см. upgrade.item в regions.yml.
  upgrade_item: "NETHERITE_INGOT"
  # Цена уровня: N × множитель + налог (N — номер покупаемого уровня).
  # Пример: с 1 на 3 уровень при множителе 3 и налоге 2 выйдет
  # (2×3+2) + (3×3+2) = 19 предметов.
  upgrade_cost_multiplier: 3
  upgrade_tax: 2
  # На каком расстоянии от ядра открывается меню (клик или /ps menu).
  menu_command_radius: 6

  # --- ОСАДА (взрывы против ядра) -------------------------------------------
  # Защита от ваншота стаком ТНТ: сколько тиков после удара ядро
  # не получает нового урона. 20 тиков = 1 секунда.
  damage_cooldown_ticks: 20
  # Взрыв снимает прочность, только если его центр был не дальше этого
  # радиуса (в блоках) от ядра. Взрывы вдалеке от ядра не вредят.
  explosion_damage_radius: 4
  # Сколько секунд после атаки висит «штраф»: починка привата дорожает.
  explosion_penalty_time: 300
  # Во сколько раз дорожает починка, пока штраф активен.
  explosion_penalty_multiplier: 2
  # Всплывающие цифры урона над ядром при взрыве.
  enable_damage_indicator: true

  # Множитель эффекта «Бустер опыта» (EXP_BOOST), покупаемого в меню.
  exp_boost_multiplier: 2.0

  # --- СВОИ МЕНЮ ВМЕСТО ВСТРОЕННЫХ (headless-режим) -------------------------
  # Позволяет отдать меню стороннему плагину (DeluxeMenus и т.п.).
  # action: MENU — встроенное меню плагина (по умолчанию);
  #         COMMAND — выполнить команды из списка ниже.
  # В командах доступны: %player% (ник), %region_id% (короткий id привата).
  # Формат: "[console] ..." — от имени консоли, "[message] ..." — сообщение
  # игроку, всё остальное — команда от имени игрока.
  custom_menus:
    main:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_main %player%"
    upgrade:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_upgrade %player%"
    effects:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_effects %player%"

# --- ТАЙМИНГИ ---------------------------------------------------------------
# Все значения раньше были зашиты в код. Ноль или отрицательное число
# откатывается к значению по умолчанию.
timings:
  menu_click_cooldown_ms: 300      # антидребезг кликов по меню (мс)
  delete_confirm_seconds: 30       # окно подтверждения /ps delete
  deny_message_cooldown_ms: 2000   # как часто повторять «нет доступа»
  move_throttle_ms: 300            # как часто пересчитывать эффекты при ходьбе
  effect_refresh_ticks: 40         # период обновления эффектов привата
  effect_duration_ticks: 60        # длительность эффекта (должна быть больше периода)
  db_flush_ticks: 60               # период сброса изменений в базу
  animation_period_ticks: 10       # шаг мерцания границ (glow)

  # Сколько секунд приват считается «под атакой» после удара: в это время
  # у голограммы тревожный вид, а плейсхолдеры показывают осаду.
  siege_window_seconds: 300

# --- ЛИМИТЫ -----------------------------------------------------------------
limits:
  autoadd_friends: 50              # максимум друзей в авто-вписывании
  db_batch_size: 500               # записей в одном пакете записи в базу
  log_page_size: 15                # строк в /ps log по умолчанию
  log_max_page_size: 50            # максимум строк, который можно запросить
  findspot_rings: 24               # как далеко /ps findspot ищет место

# --- ЗВУКИ -------------------------------------------------------------------
# Формат: ЗВУК, ЗВУК:громкость или ЗВУК:громкость:высота.
# Можно указать только имя — громкость и высота будут 1.0.
# none / off / false — выключить звук.
# Имена — как в /playsound (ENTITY_VILLAGER_NO и т.п.).
# Опечатка в имени не роняет плагин: в лог уйдёт предупреждение,
# а звук возьмётся стандартный.
sounds:
  menu_denied: ENTITY_VILLAGER_NO:1.0:1.0        # действие в меню недоступно
  menu_success: BLOCK_ANVIL_USE:1.0:1.0          # успешная покупка или прокачка
  raid_attack: ENTITY_ENDER_DRAGON_GROWL:1.0:1.0 # по привату ударили
  raid_destroyed: ENTITY_WITHER_DEATH:1.0:1.0    # приват уничтожен
  raid_nearby: ENTITY_WITHER_SHOOT:0.4:0.7       # сигнал соседям о рейде
  intruder_alert: BLOCK_NOTE_BLOCK_BELL:1.0:1.0  # чужак зашёл на территорию
  invite_received: ENTITY_EXPERIENCE_ORB_PICKUP:1.0:1.2

# --- УРОВНИ ДОСТУПА ----------------------------------------------------------
# Минимальный уровень, нужный для действия внутри чужого привата.
# Заметка: игроки с правом qweprotectstones.admin проходят везде.
# Допустимые значения: access, container, build, manager, owner.
#
# Пример: пустить к сундукам всех, кому выдан ACCESS, — container: ACCESS.
trust:
  required:
    interact: ACCESS      # двери, кнопки, рычаги, кровати
    container: CONTAINER  # сундуки, бочки, печи, воронки
    build: BUILD          # ставить и ломать блоки
    entity: BUILD         # рамки, стойки брони, картины, вагонетки
    manage: MANAGER       # меню управления, журнал, приглашения
  # Кто может менять флаги привата (/ps flag ...).
  flag_edit_level: MANAGER
  # Кто может выдавать доступ, банить и менять название.
  member_edit_level: MANAGER

# --- ФЛАГИ -------------------------------------------------------------------
flags:
  # Флаги, которые игрок НЕ может менять сам через /ps flag — только админ.
  # Пример: [pvp, entry]
  locked: []

# --- ЭФФЕКТЫ ПРИВАТОВ --------------------------------------------------------
# Кому достаётся каждый эффект из магазина эффектов:
#   MEMBERS — владельцу и доверенным (баффы);
#   ENEMIES — посторонним, зашедшим на территорию (ловушки).
# Список эффектов, доступных конкретному типу привата, — в regions.yml
# (allowed_effects). ALERTS и EXP_BOOST — встроенные псевдоэффекты
# (уведомления о атаках и бустер опыта).
effect_targets:
  EXP_BOOST: MEMBERS
  ALERTS: MEMBERS
  FAST_DIGGING: MEMBERS
  SPEED: MEMBERS
  INCREASE_DAMAGE: MEMBERS
  INVISIBILITY: MEMBERS
  HEALTH_BOOST: MEMBERS
  SLOW: ENEMIES
  WITHER: ENEMIES

# --- ВИЗУАЛЬНЫЕ НАСТРОЙКИ ------------------------------------------------------
visuals:
  # Сколько тиков показывается зелёный контур предпросмотра
  # (когда блок-ядро в руке и settings.preview_borders включён).
  preview_ticks: 60
  # Частицы, которыми рисуются границы.
  # density: 0.5 — вдвое плотнее, 2.0 — вдвое реже и дешевле.
  # Цвет учитывается только у DUST. max_points — потолок точек на каркас.
  particle:
    type: DUST
    size: 1.5
    density: 1.0
    max_points: 2000
  # Цвета кратковременной подсветки границ:
  boundaries:
    color_open: "#00FF00"    # создание привата
    color_closed: "#FF0000"  # удаление привата
    color_info: "#00B4DB"    # показ границ по /ps info
    show_time_ticks: 40      # сколько тиков показывается подсветка

# --- КАРТА (Dynmap) --------------------------------------------------------------
map:
  dynmap:
    # Рисовать границы приватов на Dynmap, если он установлен.
    enable: true
    layer_name: "Приваты"
    line_color: "#00B4DB"
    fill_color: "#00B4DB"
    fill_opacity: 0.25

# --- УВЕДОМЛЕНИЯ О РЕЙДАХ В МЕССЕНДЖЕРЫ --------------------------------------------
# Сообщение уходит, когда у привата с эффектом ALERTS снимают прочность.
# Чтобы не заспамить чат, одинаковые уведомления шлются не чаще раза в 15 сек.
notifications:
  discord_webhook: ""
  telegram_bot_token: ""
  telegram_chat_id: ""

# ============================================================
#  Типы приватов (блоки-ядра, размеры, прочность, голограммы)
#  вынесены в отдельный файл — regions.yml
# ============================================================
