# ==========================================
# QweProtectStones — приваты на блоках-ядрах
# ==========================================
# Плагин больше не требует ProtectionStones и WorldGuard.
# Приват создаётся установкой блока-ядра из секции region_types.

# --- НАСТРОЙКИ БАЗЫ ДАННЫХ ---
database:
  # Доступные типы: SQLITE (локальная БД, рекомендуется) или MYSQL
  type: "SQLITE"
  table_prefix: "qps_"
  # Настройки ниже нужны только если type: "MYSQL"
  host: "localhost"
  port: 3306
  database: "qweprotectstones"
  username: "root"
  password: ""
  use_ssl: false
  # Размер пула соединений (для SQLITE всегда принудительно 1 — так требует движок)
  pool_size: 10

# --- ОСНОВНЫЕ НАСТРОЙКИ ---
settings:
  # Выбор языка из папки /lang/
  # Доступно по умолчанию: ru_RU, en_US, es_ES, zh_CN
  language: "ru_RU"

  # Главная команда плагина. Меняется свободно — регистрируется при запуске.
  # Если имя занято другим плагином, команда останется доступна как /qweprotectstones:<имя>
  command:
    name: "ps"
    aliases:
      - "приват"
      - "region"
      - "land"
      - "rg"

  # Можно ли поставить блок-ядро как обычный блок, зажав SHIFT (приват не создастся)
  sneak_places_plain_block: true

  # Пауза между созданием приватов одним игроком (в секундах). 0 — без ограничения.
  # Защищает от спама стаком блоков-ядер. Администрации не мешает.
  region_cooldown_seconds: 3

  # Показывать контур будущего привата, когда игрок берёт блок-ядро в руку
  preview_borders: true

  # Сколько секунд живёт приглашение /ps invite
  invite_expire_seconds: 120

  # Радиус (в блоках), в котором соседи слышат идущий рядом рейд. 0 — выключено.
  raid_neighbour_radius: 48

  # --- ЗАБРОШЕННЫЕ ПРИВАТЫ ---
  abandoned:
    # Автоматически удалять приваты игроков, которые давно не заходили
    enable: false
    # Сколько дней отсутствия считается «заброшен»
    inactive_days: 60
    # Как часто проверять (в минутах)
    check_interval_minutes: 60
    # Не трогать приваты, в которые вложились (прочность выше стартовой)
    keep_upgraded: true

  # --- ЖУРНАЛ ДЕЙСТВИЙ ---
  # Кто из доверенных игроков что сломал, поставил и открыл. Смотреть: /ps log
  action_log:
    enable: true
    # Записывать открытие сундуков и других контейнеров
    log_containers: true
    # Сколько дней хранить записи
    keep_days: 14

  # Предмет, которым оплачивается прокачка "Прочности" в меню (upgrade.yml)
  upgrade_item: "NETHERITE_INGOT"
  # Множитель цены для каждого уровня (пример: 3 уровень * 3 = 9 слитков)
  upgrade_cost_multiplier: 3
  # Базовый налог, добавляемый к каждому уровню
  upgrade_tax: 2
  # Максимальное расстояние (в блоках) от ядра, на котором открывается меню
  menu_command_radius: 6

  # Защита ядра от ваншота стаком ТНТ (в игровых тиках). 20 тиков = 1 секунда.
  damage_cooldown_ticks: 20
  # Радиус вокруг ядра, в котором взрыв снимает прочность
  explosion_damage_radius: 4
  # Длительность штрафа за атаку (в секундах)
  explosion_penalty_time: 300
  # Во сколько раз дорожает починка, пока висит штраф
  explosion_penalty_multiplier: 2
  # Всплывающие цифры урона над ядром
  enable_damage_indicator: true

  # Множитель эффекта "Бустер опыта"
  exp_boost_multiplier: 2.0

  # Интеграция со сторонними меню (headless-режим).
  # action: MENU — открывается встроенное меню, COMMAND — выполняются команды ниже.
  # Плейсхолдеры: %player%, %region_id%
  custom_menus:
    main:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_main %player%"
    upgrade:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_upgrade %player%"
    effects:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_effects %player%"

# --- ЦЕЛИ ЭФФЕКТОВ ---
# MEMBERS — только владельцу и участникам (баффы)
# ENEMIES — только посторонним (ловушки)
# ---------------------------------------------------------------------------
# Тайминги. Все значения раньше были зашиты в коде — теперь их видно и можно
# менять. Ноль или отрицательное значение откатывается к значению по умолчанию.
# ---------------------------------------------------------------------------
timings:
  menu_click_cooldown_ms: 300      # антидребезг клика по меню
  delete_confirm_seconds: 30       # сколько ждать подтверждения /ps delete
  deny_message_cooldown_ms: 2000   # как часто повторять «нет доступа»
  move_throttle_ms: 300            # как часто пересчитывать эффекты при ходьбе
  effect_refresh_ticks: 40         # период обновления эффектов привата
  effect_duration_ticks: 60        # на сколько вешается эффект (должен быть больше периода)
  db_flush_ticks: 60               # период сброса накопленных изменений в базу
  animation_period_ticks: 10       # шаг анимации частиц
  siege_window_seconds: 300        # сколько приват считается «под атакой» после удара

# ---------------------------------------------------------------------------
# Лимиты
# ---------------------------------------------------------------------------
limits:
  autoadd_friends: 50              # размер списка авто-вписывания
  db_batch_size: 500               # сколько записей уходит в базу одним пакетом
  log_page_size: 15                # строк в /ps log по умолчанию
  log_max_page_size: 50            # максимум строк, который можно запросить
  findspot_rings: 24               # как далеко /ps findspot ищет свободное место

# ---------------------------------------------------------------------------
# Звуки. Формат: ЗВУК, ЗВУК:громкость или ЗВУК:громкость:высота.
# Значение none или off выключает звук совсем.
# ---------------------------------------------------------------------------
sounds:
  menu_denied: ENTITY_VILLAGER_NO:1.0:1.0        # действие в меню недоступно
  menu_success: BLOCK_ANVIL_USE:1.0:1.0          # успешная покупка или прокачка
  raid_attack: ENTITY_ENDER_DRAGON_GROWL:1.0:1.0 # по привату ударили
  raid_destroyed: ENTITY_WITHER_DEATH:1.0:1.0    # приват уничтожен
  raid_nearby: ENTITY_WITHER_SHOOT:0.4:0.7       # сигнал соседям о рейде
  intruder_alert: BLOCK_NOTE_BLOCK_BELL:1.0:1.0  # чужак на территории
  invite_received: ENTITY_EXPERIENCE_ORB_PICKUP:1.0:1.2

# ---------------------------------------------------------------------------
# Уровни доступа. Можно, например, разрешить открывать сундуки всем, кому выдан
# ACCESS: container: ACCESS. Допустимые значения — access, container, build,
# manager, owner.
# ---------------------------------------------------------------------------
trust:
  required:
    interact: ACCESS      # двери, кнопки, рычаги, кровати
    container: CONTAINER  # сундуки, бочки, печи, воронки
    build: BUILD          # ставить и ломать блоки
    entity: BUILD         # рамки, стойки брони, картины, вагонетки
    manage: MANAGER       # меню управления, журнал
  flag_edit_level: MANAGER    # кто может менять флаги привата
  member_edit_level: MANAGER  # кто может выдавать доступ, банить и менять название

# ---------------------------------------------------------------------------
# Флаги
# ---------------------------------------------------------------------------
flags:
  # Флаги, которые игрок не может менять сам, — остаются только у админов.
  # Например: [pvp, entry]
  locked: []

effect_targets:
  EXP_BOOST: MEMBERS
  ALERTS: MEMBERS
  FAST_DIGGING: MEMBERS
  SPEED: MEMBERS
  INCREASE_DAMAGE: MEMBERS
  INVISIBILITY: MEMBERS
  HEALTH_BOOST: MEMBERS
  SLOW: ENEMIES
  WITHER: ENEMIES

# --- ВИЗУАЛЬНЫЕ НАСТРОЙКИ ---
visuals:
  # Сколько тиков показывается контур предпросмотра (settings.preview_borders)
  preview_ticks: 60
  # Чем и как густо рисуются границы. Цвет учитывается только у DUST.
  particle:
    type: DUST
    size: 1.5
    density: 1.0      # 0.5 — вдвое плотнее, 2.0 — вдвое реже и дешевле
    max_points: 2000  # потолок точек на один каркас
  boundaries:
    color_open: "#00FF00"    # создание привата
    color_closed: "#FF0000"  # удаление привата
    color_info: "#00B4DB"    # показ границ по /region info
    show_time_ticks: 40

# --- ИНТЕГРАЦИЯ С КАРТОЙ ---
map:
  dynmap:
    # Рисовать границы приватов на Dynmap (если он установлен)
    enable: true
    layer_name: "Приваты"
    line_color: "#00B4DB"
    fill_color: "#00B4DB"
    fill_opacity: 0.25

# --- ИНТЕГРАЦИЯ С МЕССЕНДЖЕРАМИ ---
notifications:
  discord_webhook: ""
  telegram_bot_token: ""
  telegram_chat_id: ""

# ==========================================
# НАСТРОЙКИ ПО УМОЛЧАНИЮ ДЛЯ ВСЕХ ПРИВАТОВ
# ==========================================
# Любой параметр отсюда можно переопределить в конкретном типе ниже.

# ===========================================================================
#  Типы приватов переехали в отдельный файл regions.yml
# ===========================================================================
#  Там описываются блоки-ядра: размер, прочность, флаги, голограммы, звуки.
#  Секции default_region и region_types в этом файле больше не читаются.
#  При обновлении они переносятся в regions.yml автоматически.
