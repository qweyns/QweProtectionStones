# ============================================================
#   QweProtectStones v2.0.0 — приваты на блоках-ядрах
# ============================================================
#  Как работает плагин:
#   • игрок ставит блок-ядро (типы блоков — в regions.yml);
#   • вокруг ядра возникает защищённая территория;
#   • ядро можно «осаждать» взрывами — у него есть прочность;
#   • управление: меню по клику на ядро или /ps <команда>.
#
#  Настройки разложены по темам, чтобы каждый файл был коротким:
#    config.yml      — этот файл: база, команда, лимиты, доступ;
#    protection.yml  — движок защиты (воронки, трюки через границу, флаги);
#    siege.yml       — осады: могут ли взрывы снимать прочность ядра;
#    effects.yml     — эффекты приватов и их покупка;
#    visuals.yml     — границы, звуки, карта (Dynmap/BlueMap);
#    features.yml    — рынок, аренда, бэкапы, телепорт, импорт, уведомления;
#    regions.yml     — типы приватов (блоки, размеры, прочность).
#
#  После правок: /qps reload — применит почти всё.
#  Смена команды, БД и connect timeout HTTP-клиентов — после рестарта.
#  Отсутствующие общие ключи читаются из jar; ваши файлы не перезаписываются.
# ============================================================

# --- БАЗА ДАННЫХ -----------------------------------------------------------
database:
  # SQLITE — локальная база-файл (ничего настраивать не нужно),
  # MYSQL — отдельный сервер (заполните поля ниже).
  type: "SQLITE"
  # Префикс таблиц плагина в базе. Менять стоит только при конфликте имён.
  table_prefix: "qps_"
  # Дальнейшие поля используются только при type: "MYSQL".
  host: "localhost"
  port: 3306
  database: "qweprotectstones"
  username: "root"
  password: ""
  use_ssl: false
  # Пул соединений. Для SQLITE всегда принудительно 1 — так устроен движок.
  pool_size: 10
  # Только SQLite: ожидание занятой БД, мс (0..60000). Нужен рестарт.
  sqlite_busy_timeout_ms: 5000

# --- ОСНОВНЫЕ НАСТРОЙКИ ----------------------------------------------------
settings:
  # Минимальная длина префикса id привата в командах (/qps delete <id> и т.п.).
  # Если под префикс подходит несколько приватов, команда покажет их список.
  min-id-prefix: 4
  # PDC-теги на предметах-ядрах: /qps give помечает блок типом, а при
  # поломке предмет (с сохранённой прочностью, см. return-durability)
  # выпадает на пол у ядра.
  core-item-tags: true
  # Возвращать при поломке ядра накопленную прочность (в PDC предмета).
  return-durability: true
  # Переносить ли при поломке ядра штраф за атаку и время последней атаки:
  # «сломал и поставил» не обнуляет их, штраф догорает даже в сундуке.
  transfer-penalty: true
  # Язык сообщений: ru_RU, en_US, es_ES, zh_CN (файлы в /lang/).
  language: "ru_RU"

  # Файловый журнал критических операций: удаления, передачи, сделки рынка
  # и административные правки. Дублирует самое важное из базы в обычный
  # текстовый файл — читается любым редактором и переживает проблемы с БД.
  critical_log:
    enable: true
    # Папка относительно папки плагина.
    folder: "logs"
    file-name: "critical.log"
    # При превышении размера текущий файл переименовывается в .old
    # (хранится одна предыдущая копия).
    rotate-size-mb: 10
    # Период сброса файлового журнала на диск, тики (1..72000).
    flush_ticks: 100

  # Главная команда игроков. Регистрируется при запуске.
  # Если имя занято другим плагином, команда останется доступна
  # как /qweprotectstones:<имя>.
  command:
    name: "ps"
    aliases:
      - "приват"
      - "region"
      - "land"
      - "rg"

  # Пауза (в секундах) между созданием приватов одним игроком.
  # Защищает от спама стаком блоков-ядер. Администраторов не касается.
  # 0 — без ограничения.
  region_cooldown_seconds: 3

  # Подсказка в actionbar, когда блок-ядро в руке: влезет ли приват
  # и не пересекается ли он с чужим. По умолчанию выключена.
  # (Подсветка границ частицами при взятии в руку убрана совсем.)
  preview-messages: false

  # Сколько секунд действует приглашение /ps invite <ник>.
  invite_expire_seconds: 120

  # --- ЗАБРОШЕННЫЕ ПРИВАТЫ -------------------------------------------------
  # Автоудаление приватов игроков, которые давно не заходили на сервер.
  abandoned:
    enable: false
    # Сколько дней не заходил владелец, чтобы приват считался брошенным.
    inactive_days: 60
    # Как часто проверять (в минутах).
    check_interval_minutes: 60
    # Не трогать приваты, в которые вложились (прочность выше стартовой).
    keep_upgraded: true
    # Не трогать приваты, выставленные на продажу или в аренду.
    skip_listed: true
    # Участники с этими ролями (id из roles.yml) тоже считаются активностью:
    # пока кто-то из них заходит, приват не удаляется. "*" — любой участник,
    # [] — учитывать только владельца.
    active_member_roles: [manager]
    # Только писать в консоль, что было бы удалено, ничего не удаляя.
    # Удобно включить на первый прогон после настройки.
    dry_run: false
    # Не больше стольких удалений за одну проверку (0 — без ограничения).
    # Защита от массового сноса при ошибке в настройках или данных.
    max_per_sweep: 50

  # --- ЖУРНАЛ ДЕЙСТВИЙ -----------------------------------------------------
  # Кто из доверенных что ломал, ставил и открывал. Просмотр: /ps log
  action_log:
    enable: true
    # Записывать ли открытие сундуков и прочих контейнеров.
    log_containers: true
    # Сколько дней хранить записи (очистка по расписанию ниже).
    keep_days: 14
    # Сохранять журнал удалённого привата (снос, рейд, автоочистка) до истечения
    # keep_days — чтобы можно было разобраться, что произошло.
    keep_on_delete: true
    prune_interval_minutes: 1440    # период очистки, 1..525600 минут
    prune_initial_delay_seconds: 120 # задержка после старта/reload, 1..86400 секунд

  # Предмет, которым оплачивается прокачка прочности в меню «Улучшение».
  # Тип привата может задать свой — см. upgrade.item в regions.yml.
  upgrade_item: "NETHERITE_INGOT"
  # Цена уровня: N × множитель + налог (N — номер покупаемого уровня).
  # Пример: с 1 на 3 уровень при множителе 3 и налоге 2 выйдет
  # (2×3+2) + (3×3+2) = 19 предметов.
  upgrade_cost_multiplier: 3
  upgrade_tax: 2
  # На каком расстоянии от ядра открывается меню (клик или /ps menu).
  menu_command_radius: 6

  # --- СВОИ МЕНЮ ВМЕСТО ВСТРОЕННЫХ (headless-режим) -------------------------
  # Позволяет отдать меню стороннему плагину (DeluxeMenus и т.п.).
  # action: MENU — встроенное меню плагина (по умолчанию);
  #         COMMAND — выполнить команды из списка ниже.
  # В командах доступны: %player% (ник), %region_id% (короткий id привата).
  # Формат: "[console] ..." — от имени консоли, "[message] ..." — сообщение
  # игроку, всё остальное — команда от имени игрока.
  custom_menus:
    main:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_main %player%"
    upgrade:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_upgrade %player%"
    effects:
      action: "MENU"
      commands:
        - "[console] dm open custom_ps_effects %player%"

# --- ТАЙМИНГИ ---------------------------------------------------------------
# Основные периоды и задержки. Старые ключи <= 0 используют fallback;
# autoadd_retry_ticks ограничивается указанным безопасным диапазоном.
timings:
  menu_click_cooldown_ms: 300      # антидребезг кликов по меню (мс)
  delete_confirm_seconds: 30       # окно подтверждения /ps delete
  deny_message_cooldown_ms: 2000   # как часто повторять «нет доступа»
  move_throttle_ms: 300            # как часто пересчитывать эффекты при ходьбе
  effect_refresh_ticks: 40         # период обновления эффектов привата
  effect_duration_ticks: 60        # длительность эффекта (должна быть больше периода)
  autoadd_retry_ticks: 100         # повтор загрузки autoadd при ошибке БД, 1..72000
  db_flush_ticks: 60               # период сброса изменений в базу
  animation_period_ticks: 10       # шаг мерцания границ (glow)

# --- ЛИМИТЫ -----------------------------------------------------------------
limits:
  autoadd_friends: 50              # максимум друзей в авто-вписывании
  db_batch_size: 500               # записей в одном пакете записи в базу
  log_page_size: 15                # строк в /ps log по умолчанию
  log_max_page_size: 50            # максимум строк, который можно запросить
  findspot_rings: 24               # как далеко /ps findspot ищет место

# --- СПРАВКА (/ps help и /qps help) -----------------------------------------
# Команды выводятся постранично с кнопками перелистывания.
help:
  # Что делает /ps без аргументов: help — справка (только доступные игроку
  # команды), menu — меню привата, в котором он стоит.
  # /qps без аргументов всегда показывает справку по доступным действиям.
  no-args: help
  # Команд на страницу в /ps help (игровая справка).
  page-size: 8
  # Команд на страницу в /qps help (административная справка).
  admin-page-size: 10

# --- СООБЩЕНИЯ ПРИ ВХОДЕ И ВЫХОДЕ -------------------------------------------
# Тексты входа/выхода — шаблоны region_enter / region_leave из lang-файла
# (плейсхолдеры %owner%, %name%, %type%); игроки их менять не могут.
# channel:  CHAT — в чат (по умолчанию); NONE — не показывать.
#           Значение ACTIONBAR из старых конфигов читается как CHAT.
# enabled:  false — отключить сообщение целиком (для входа и выхода раздельно).
# Флаг привата greeting (/ps flag greeting) по-прежнему выключает оба
# сообщения для конкретного привата.
region-messages:
  enter:
    enabled: true
    channel: "CHAT"
  leave:
    enabled: true
    channel: "CHAT"

# --- РОЛИ ---------------------------------------------------------------------
# Роли участников и их права настраиваются в roles.yml.

# --- АДМИНИСТРИРОВАНИЕ (/qps) ------------------------------------------------
admin:
  # База прав для подкоманд: право действия = <префикс>.<действие>,
  # например qweprotectstones.admin.give или qweprotectstones.admin.delete.
  permission-prefix: "qweprotectstones.admin"
  # true — общего права qweprotectstones.admin недостаточно: на каждое действие
  # нужно отдельное право (удобно, чтобы выдать модератору только /qps tp и info).
  require-per-action: false
  give:
    # Максимум блоков-ядер за одну выдачу /qps give.
    max-amount: 64
  # На сколько блоков выше ядра приземляется игрок при /qps tp.
  teleport-offset-y: 1.0

# --- ДИАГНОСТИКА (/qps debug) ------------------------------------------------------
debug:
  # Подробный режим: список типов и число приватов каждого типа.
  verbose: false

# --- ПРОВЕРКА ОБНОВЛЕНИЙ ------------------------------------------------------------
updates:
  # Сравнивать версию с последним релизом на GitHub и напоминать
  # в консоль и операторам при входе. Сеть используется только для этого
  # запроса раз в период.
  enabled: true
  # Как часто проверять, часов.
  period-hours: 12
  initial-delay-ticks: 100         # первый запрос после старта/reload, 1..72000
  http-timeout-seconds: 10         # 1..120; connect timeout меняется после рестарта

# --- МЕТРИКИ bStats ------------------------------------------------------------------
metrics:
  # Анонимная статистика использования (bstats.org). Отключите, если сервер
  # не должен никуда обращаться.
  enable: true
  # Идентификатор плагина на bstats.org. 0 — ничего не отправлять.
  plugin-id: 33994
