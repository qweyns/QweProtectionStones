# ============================================================
#   QweProtectStones — осады (siege.yml)
# ============================================================
#  Взрывы не ломают постройки внутри привата — вместо этого они
#  снимают ПРОЧНОСТЬ ядра. Прочность кончилась — приват падает.
#
#  Что чем настраивается:
#    enabled                — главный выключатель: могут ли взрывы
#                             вообще снимать прочность (false = осад нет,
#                             блоки внутри всё равно защищены флагом
#                             explosion_damage);
#    damage_cooldown_ticks  — защита от ваншота стаком ТНТ;
#    explosion_damage_radius— дальность взрыва от ядра, чтобы снять прочность;
#    penalty_time / penalty_multiplier — во сколько раз дорожает починка
#                             после атаки и на сколько секунд;
#    damage_indicator       — всплывающие цифры урона над ядром;
#    neighbour_alert_radius — кому из соседей слышно, что рядом рейд;
#    window_seconds         — сколько секунд приват считается «под атакой»;
#    deny_core_break_under_attack — запрет сносить ядро, пока окно атаки
#                             не закрылось (иначе осада сбрасывается
#                             «сломал-поставил»).
#
#  Переопределения для конкретного типа привата — в regions.yml
#  (damage_cooldown_ticks, explosion_damage_radius, raid_immune
#  и секция explosions: какой вид взрыва вообще вредит ядру).
# ============================================================

siege:
  # Главный выключатель: false — взрывы не снимают прочность ядер
  # и атаки не засчитываются. Защита блоков при этом работает как раньше.
  enabled: true

  # Защита от ваншота стаком ТНТ: сколько тиков после удара ядро
  # не получает нового урона. 20 тиков = 1 секунда.
  damage_cooldown_ticks: 20

  # Прочность за один принятый Bukkit-взрыв (1..1000000). API задаёт урон отдельно.
  damage_per_explosion: 1

  # Взрыв снимает прочность, только если его центр был не дальше этого
  # радиуса (в блоках) от ядра. Аддон может увеличить радиус через API.
  # Итоговый радиус ограничен 256 блоками (защита от неограниченного поиска).
  explosion_damage_radius: 4

  # Штраф только после принятого урона: отмена, иммунитет и cooldown его не продлевают.
  # Сколько секунд починка привата дорожает (<= 0 возвращает 300).
  penalty_time: 300
  # Во сколько раз дорожает починка, пока штраф активен.
  penalty_multiplier: 2

  # Всплывающие цифры урона над ядром при взрыве.
  damage_indicator: true

  # Радиус (в блоках), в котором соседям слышно, что рядом идёт рейд
  # (звук raid_nearby из visuals.yml + уведомление). 0 — не сообщать соседям.
  neighbour_alert_radius: 48

  # Сколько секунд приват считается «под атакой» после удара: в это время
  # у голограммы тревожный вид, а плейсхолдеры показывают осаду.
  window_seconds: 300

  # Пока окно атаки не закрылось, владелец не может снести ядро привата
  # (у игроков с обходом защиты ограничения нет). Штраф за атаку при этом
  # всё равно переносится предметом ядра — см. settings.transfer-penalty.
  deny_core_break_under_attack: true
