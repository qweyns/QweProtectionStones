# ============================================================
#   QweProtectStones — защита территорий (protection.yml)
# ============================================================
#  Правила движка защиты: что запрещено делать в чужом привате
#  (кроме случаев, когда выдан доступ или право обхода).
#  Роли и их права — в roles.yml.
# ============================================================

# --- ЗАЩИТА ОТ АВТОМАТИЧЕСКИХ ПЕРЕНОСОВ ----------------------------------------------
# Воронки, дроперы и вагонетки-воронки снаружи не должны обносить чужие сундуки.
protection:
  hoppers:
    enable: true
    # Запретить вытягивать предметы из чужих контейнеров (кража воронкой).
    block-outflow: true
    # Запретить заталкивать предметы в чужие контейнеры (засорение).
    # По умолчанию выключено: «подарить» предметы воронкой обычно можно.
    block-inflow: false

  # Трюки через границу привата.
  border:
    # Ледоход (ботинки) не замораживает воду в чужом привате
    # (проверяется уровень доступа BUILD).
    frost-walker: true
    # Следы мобов (снег голема) подчиняются флагу MOB_GRIEFING.
    # false — вернуть прежнее поведение (решает только флаг ICE_AND_SNOW).
    mob-trails: true
    # Костная мука, внесённая снаружи, не прорастает в чужой приват.
    bonemeal: true
    # Удочка не вытаскивает из чужого привата мобов и предметы
    # (предметы — по флагу ITEM_PICKUP).
    fishing: true
    # Раздатчик снаружи (или из чужого привата) не применяет предметы
    # внутри привата: не выливает лаву и воду, не черпает жидкость, не поджигает.
    # Раздатчики в приватах того же владельца не ограничиваются.
    dispensers:
      enable: true
      # Какие предметы запрещены. "*" — любые (включая стрелы и TNT),
      # "*_BUCKET" — все вёдра, "SHULKER*" — по началу названия.
      items:
        - "*_BUCKET"
        - "BUCKET"
        - "FLINT_AND_STEEL"
        - "FIRE_CHARGE"
        - "BONE_MEAL"
        - "SHEARS"
        - "GLASS_BOTTLE"
        - "HONEYCOMB"
        - "ARMOR_STAND"
        - "*SHULKER_BOX"
        - "CARVED_PUMPKIN"
        - "*_SKULL"
        - "*_HEAD"
        - "*_BOAT"
        - "*_RAFT"
        - "*MINECART"

  # Поршни и ядро привата.
  pistons:
    # Разрешить поршням двигать ядро — но только внутри границ самого
    # привата (вывезти наружу не выйдет). Границы при этом не меняются.
    # false — ядро стоит намертво. Разрушаемое поршнем ядро не переносится.
    # Проверяются все затронутые ядра; при отмене события перенос не фиксируется.
    move-core: false

# --- ФЛАГИ -------------------------------------------------------------------
flags:
  # Флаги, которые игрок НЕ может менять сам через /ps flag — только админ.
  # Пример: [pvp, entry]
  locked: []
