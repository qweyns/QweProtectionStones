# ============================================================
#   QweProtectStones — защита территорий (protection.yml)
# ============================================================
#  Правила движка защиты: что запрещено делать в чужом привате
#  (кроме случаев, когда выдан доступ или право обхода).
#  Роли и их права — в roles.yml.
# ============================================================

# --- ЗАЩИТА ТЕРРИТОРИИ: огонь, воронки, границы, поршни, клики, снаряды -------------
# Воронки, дроперы и вагонетки-воронки снаружи не должны обносить чужие сундуки.
protection:
  fire:
    # Поджог молнией (гроза, трезубец с «Громовержцем») подчиняется флагу fire_spread.
    # false — молния поджигает приваты всегда, как раньше.
    lightning-respects-flag: true

  hoppers:
    enable: true
    # Запретить вытягивать предметы из чужих контейнеров (кража воронкой).
    block-outflow: true
    # Запретить заталкивать предметы в чужие контейнеры (засорение).
    # По умолчанию выключено: «подарить» предметы воронкой обычно можно.
    block-inflow: false

  # Трюки через границу привата.
  border:
    # Ледоход (ботинки) не замораживает воду в чужом привате
    # (проверяется уровень доступа BUILD).
    frost-walker: true
    # Следы мобов (снег голема) подчиняются флагу MOB_GRIEFING.
    # false — вернуть прежнее поведение (решает только флаг ICE_AND_SNOW).
    mob-trails: true
    # Костная мука, внесённая снаружи, не прорастает в чужой приват.
    bonemeal: true
    # Удочка не вытаскивает из чужого привата мобов и предметы
    # (предметы — по флагу ITEM_PICKUP).
    fishing: true
    # Раздатчик снаружи (или из чужого привата) не применяет предметы
    # внутри привата: не выливает лаву и воду, не черпает жидкость, не поджигает.
    # Раздатчики в приватах того же владельца не ограничиваются.
    dispensers:
      enable: true
      # Какие предметы запрещены. "*" — любые (включая стрелы и TNT),
      # "*_BUCKET" — все вёдра, "SHULKER*" — по началу названия.
      items:
        - "*_BUCKET"
        - "BUCKET"
        - "FLINT_AND_STEEL"
        - "FIRE_CHARGE"
        - "BONE_MEAL"
        - "SHEARS"
        - "GLASS_BOTTLE"
        - "HONEYCOMB"
        - "ARMOR_STAND"
        - "*SHULKER_BOX"
        - "CARVED_PUMPKIN"
        - "*_SKULL"
        - "*_HEAD"
        - "*_BOAT"
        - "*_RAFT"
        - "*MINECART"

  # Поршни и ядро привата.
  pistons:
    # Разрешить поршням двигать ядро — но только внутри границ самого
    # привата (вывезти наружу не выйдет). Границы при этом не меняются.
    # false — ядро стоит намертво. Разрушаемое поршнем ядро не переносится.
    # Проверяются все затронутые ядра; при отмене события перенос не фиксируется.
    move-core: false

  # Какое действие роли (см. roles.yml) нужно для взаимодействия в чужом привате.
  # Списки: точное имя, "*_BUCKET" (окончание), "POTTED_*" (начало),
  # "*CANDLE*" (подстрока), "#doors" — тег Minecraft. Порядок действий важен:
  # срабатывает первое подошедшее правило.
  interact:
    # Запрещён только клик по блоку — предмет в руке всё равно работает
    # (можно есть, пить, стрелять, кидать жемчуг, глядя на чужой блок).
    # false — отменять взаимодействие целиком, как раньше.
    keep-item-use: true
    # Правый клик по блоку С ПРЕДМЕТОМ из списка — проверяется первым.
    # Если действие не разрешено, отменяется всё взаимодействие.
    items:
      build:
        - FLINT_AND_STEEL
        - FIRE_CHARGE
        - BONE_MEAL
        - ARMOR_STAND
        - END_CRYSTAL
        - ITEM_FRAME
        - GLOW_ITEM_FRAME
        - PAINTING
        - "*MINECART"
        - "*_BUCKET"
        - "*_SPAWN_EGG"
        - "*_BOAT"
        - "*_RAFT"
        - "*_AXE"       # обтёсывание брёвен, очистка меди
        - "*_HOE"       # вспахивание
        - "*_SHOVEL"    # тропинки, тушение костра
        - SHEARS        # тыквы, ульи, лианы
        - HONEYCOMB     # вощение меди
        - BRUSH         # подозрительный песок/гравий
        - GLASS_BOTTLE  # мёд из улья
        - "*_DYE"       # покраска табличек
        - INK_SAC
        - GLOW_INK_SAC
    # Правый клик по блоку. Контейнеры (сундуки, печи, бочки, воронки...)
    # определяются автоматически и требуют container-action.
    blocks:
      build:
        - FARMLAND
        - TURTLE_EGG
        - SNIFFER_EGG
        - RESPAWN_ANCHOR
        - CAKE
        - "*CANDLE_CAKE"
        - DRAGON_EGG
        - SPAWNER
        - JUKEBOX
        - COMPOSTER
        - FLOWER_POT
        - "POTTED_*"
        - CAULDRON
        - "*_CAULDRON"
        - SWEET_BERRY_BUSH
        - CAVE_VINES
        - CAVE_VINES_PLANT
        - "#all_signs"   # редактирование табличек
        - REPEATER
        - COMPARATOR
        - DAYLIGHT_DETECTOR
        - "*CANDLE"
      interact:
        - "#doors"
        - "#trapdoors"
        - "#fence_gates"
        - "#buttons"
        - "#beds"
        - LEVER
        - CRAFTING_TABLE
        - ENDER_CHEST
        - BELL
        - NOTE_BLOCK
        - LECTERN
    # Контейнеры, не попавшие в blocks.
    container-action: container
    # Прочие блоки, по которым правый клик что-то делает (по камню — нет,
    # такие клики вообще не проверяются).
    default-block-action: container
    # Нажимные плиты, растяжки, вспашка ногами.
    physical:
      build:
        - FARMLAND
        - TURTLE_EGG
        - SNIFFER_EGG
    default-physical-action: interact
    # Правый клик по сущности.
    entities:
      entity:
        - ITEM_FRAME
        - GLOW_ITEM_FRAME
        - ARMOR_STAND
        - PAINTING
      interact:
        - VILLAGER
        - WANDERING_TRADER
      container:
        - "*MINECART"
        - "*CHEST_BOAT"
        - "*CHEST_RAFT"
    default-entity-action: container
    # Действия с мобами, у которых свои события.
    entity-actions:
      leash: entity    # привязать поводком
      shear: entity    # остричь овцу, грибную корову
      bucket: entity   # забрать рыбу/аксолотля в ведро
    # Поджечь TNT в чужом привате (огнивом, горящей стрелой).
    tnt-prime-action: build

  # Снаряды игроков (стрелы, трезубцы, снежки) при попадании в блок.
  # Блоки не из списков снаряды задевать могут как обычно.
  projectiles:
    blocks:
      interact:
        - "#buttons"
        - "#pressure_plates"
        - TARGET
        - BELL
      build:
        - CHORUS_FLOWER
        - DECORATED_POT
        - POINTED_DRIPSTONE
        - "*CANDLE"
        - "*CANDLE_CAKE"
        - "#campfires"

# --- УСТАНОВКА ПРИВАТА (антиабуз) --------------------------------------------
# Право qweprotectstones.bypass.creation-rules снимает все ограничения ниже.
creation:
  # Пауза (сек.) после того, как игрок сам снёс свой приват (ядром или /ps delete),
  # до установки нового. Мешает «прыгать» ядром к чужой базе. 0 — без паузы
  # (ядро можно свободно переносить).
  recreate-cooldown-seconds: 0
  # Нельзя ставить приват ближе этого расстояния (блоков) к чужому привату,
  # который сейчас в осаде: рейдеров не запрут чужим приватом посреди атаки. 0 — выкл.
  near-siege-radius: 48
  # Нельзя ставить приват ближе этого расстояния (по горизонтали) к точке спавна мира. 0 — выкл.
  spawn-radius: 0
  # Приват не может закрывать эти блоки (с отступом forbidden-blocks-radius, до 32):
  # чтобы одним ядром не отобрать у всех портал в Незер или в Энд.
  # Поддерживаются шаблоны и теги, как в interact. Пустой список — выкл.
  # Проверяется высота ±64 блока от ядра.
  forbidden-blocks:
    - NETHER_PORTAL
    - END_PORTAL
    - END_PORTAL_FRAME
    - END_GATEWAY
  forbidden-blocks-radius: 4

# --- ФЛАГИ -------------------------------------------------------------------
flags:
  # Флаги, которые игрок НЕ может менять сам через /ps flag — только админ.
  # На анархии владелец не должен превращать приват в безопасную зону
  # или неломаемую крепость, поэтому pvp и explosion_damage закрыты.
  # Для обычного выживания поставьте locked: [] и pvp: false в regions.yml.
  locked:
    - pvp
    - explosion_damage
