# ============================================================================
#  РОЛИ УЧАСТНИКОВ ПРИВАТА
# ============================================================================
#  Здесь полностью описываются роли: их id, названия, старшинство и права.
#  Стандартные роли можно переименовать, удалить или добавить свои.
#
#  id роли (ключ в roles.list) — латиница, цифры, _ и -. Он хранится в базе,
#  поэтому менять id у уже выданной роли не стоит — для переименования
#  меняйте display. Если id всё же поменяли, добавьте псевдоним в aliases,
#  иначе у участников со старой ролью не будет никаких прав.
#
#  weight   — старшинство. Выдавать и снимать можно только роли ниже своей.
#  grantable — можно ли выдать роль командой /ps trust и из меню.
#  inherit  — роль (или список ролей), чьи действия наследуются.
#  actions  — разрешённые действия. "-действие" запрещает унаследованное,
#             "*" — все действия.
#
#  Действия:
#    interact      двери, кнопки, рычаги, кровати, жители
#    container     сундуки, бочки, печи, воронки, вагонетки с сундуком
#    build         ставить и ломать блоки, инструменты по блокам, вёдра
#    entity        рамки, стойки брони, картины, мобы, транспорт
#    menu          открыть меню привата (клик по ядру, /ps menu)
#    manage        журнал привата и функции управляющего
#    flags         менять флаги (/ps flag)
#    members       выдавать и отзывать роли, приглашать
#    ban           банить и разбанивать
#    rename        название и оформление привата
#    upgrade       улучшение прочности, покупка эффектов
#    home          /ps home к этому привату
#    view-members  смотреть список участников
#    glow          подсветка границ (/ps glow)
#    effects       получать эффекты привата и бонус опыта
#    alerts        получать уведомления об атаке на приват
#    entry         входить, въезжать на транспорте и телепортироваться, даже если флаги entry/vehicle-entry/teleport-in выключены
#
#  Владелец (owner) — встроенная роль: у неё все действия, её нельзя выдать.
#  Продавать и сдавать в аренду может только владелец — деньги идут ему.
# ============================================================================
roles:
  # Название роли владельца (MiniMessage).
  owner-display: "Владелец"

  # Роль по умолчанию: /ps trust <ник> без роли, автодобавление друзей, импорт.
  default-role: build

  # Роль, которую получает любой игрок во флаге public-access.
  # Пусто — флаг ничего не даёт.
  public-access-role: container

  # Старые id → новые. Нужны, если переименовали id выданной роли.
  aliases: {}

  list:
    access:
      display: "Доступ"
      weight: 10
      grantable: true
      actions: [interact, menu, home, view-members, glow, effects, entry]

    container:
      display: "Сундуки"
      weight: 20
      grantable: true
      inherit: access
      actions: [container]

    build:
      display: "Строительство"
      weight: 30
      grantable: true
      inherit: container
      actions: [build, entity]

    manager:
      display: "Управляющий"
      weight: 40
      grantable: true
      inherit: build
      actions: [manage, flags, members, ban, rename, upgrade, alerts]

    # Пример своей роли — раскомментируйте:
    # farmer:
    #   display: "<#86EFAC>Фермер"
    #   weight: 25
    #   grantable: true
    #   inherit: access
    #   actions: [build, container]
